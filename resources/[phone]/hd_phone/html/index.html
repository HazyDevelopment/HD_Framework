<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HD Phone</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div id="device">
            <div id="screen">
                <div id="notch"></div>

                <div id="statusbar">
                    <span id="sb-time">9:41</span>
                    <div class="sb-icons" id="sb-toggle">
                        <svg id="sb-signal" width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                        <svg id="sb-wifi" width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 10.5a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8Zm-3.2-3.6a4.6 4.6 0 0 1 6.4 0l-1.3 1.3a2.8 2.8 0 0 0-3.8 0L4.8 6.9Zm-2.6-2.6a8.2 8.2 0 0 1 11.6 0l-1.3 1.3a6.4 6.4 0 0 0-9 0L2.2 4.3Z"/></svg>
                        <svg id="sb-battery" width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="17" height="8" rx="1.3" fill="currentColor"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
                    </div>
                </div>

                <div id="screens"></div>

                <div id="control-center" class="hidden"></div>
                <div id="call-overlay" class="hidden"></div>
                <div id="toast" class="hidden"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/apps/settings.js"></script>
    <script src="js/apps/camera.js"></script>
    <script src="js/apps/photos.js"></script>
    <script src="js/apps/contacts.js"></script>
    <script src="js/apps/phone.js"></script>
    <script src="js/apps/messages.js"></script>
    <script src="js/apps/social.js"></script>
    <script src="js/apps/bank.js"></script>
    <script src="js/apps/mail.js"></script>
    <script src="js/apps/marketplace.js"></script>
    <script src="js/apps/notes.js"></script>
    <script src="js/apps/crypto.js"></script>
    <script src="js/apps/matchup.js"></script>
    <script src="js/apps/darkchat.js"></script>
    <script src="js/apps/voicememo.js"></script>
    <script src="js/apps/garages.js"></script>
    <script src="js/apps/music.js"></script>
    <script src="js/apps/facetime.js"></script>
    <script src="js/apps/appstore.js"></script>
    <script src="js/apps/maps.js"></script>
    <script src="js/apps/clock.js"></script>
    <script src="js/apps/placeholder.js"></script>
</body>
</html>
