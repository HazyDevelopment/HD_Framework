<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HD HUD</title>
<!-- ?v= busts CEF's NUI cache — bump any time html/css/js changes stop
     showing up after a resource restart. -->
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<div id="root">
    <div id="watermark">Hazy Development</div>

    <!-- ═══════════════════════ TOP RIGHT: CASH / JOB ═══════════════════ -->
    <div id="topRight">
        <div id="cashRow"><span id="cashValue">£0</span></div>
        <div id="jobRow">
            <span id="jobLabel">Unemployed</span>
            <span id="jobGrade"></span>
        </div>
    </div>

    <!-- ═══════════════════════ MINIMAP CLUSTER (vehicle only) ═══════════ -->
    <!-- Purely decorative — the actual map is the native radar,
         repositioned by client/main.lua's ApplyCustomMinimapLayout to
         sit right behind #minimapFrame. compassBar doubles as the
         OPAQUE panel that used to be a separate minimapShroud div: NUI
         always paints on top of the game frame, so it fully occludes
         GTA's native health/armour bar (which renders as a strip just
         above the radar, tied to the radar component itself — there's
         no native to peel it off independently) without touching the
         radar texture underneath it — it's just doing that job while
         also showing something useful instead of a blank panel. -->
    <div id="minimapCluster" class="hidden">
        <div id="compassBar">
            <div id="streetName">&nbsp;</div>
            <div id="compassTicks"><span id="compassHeading">N</span><div id="compassCenterMark"></div></div>
        </div>
        <div id="minimapFrame"></div>
    </div>

    <!-- ═══════════════════════ BOTTOM LEFT: VITALS ═════════════════════ -->
    <!-- Flat vector glyphs (same inline-SVG-icon convention as hd_phone)
         instead of OS emoji — emoji glyph shape/colour varies by
         platform font and can render as a blank tofu box in CEF, vector
         paths always look the same. -->
    <div id="vitals">
        <div class="vital" data-key="health">
            <div class="vital-ring"><div class="vital-fill"></div><span class="vital-icon">
                <svg viewBox="0 0 24 24"><path d="M12 20.5 3.5 12.7C1 10.4 1 6.7 3.4 4.5c2.2-2 5.6-1.8 7.7.4l.9.9.9-.9c2.1-2.2 5.5-2.4 7.7-.4C22.9 6.7 23 10.4 20.5 12.7Z"/></svg>
            </span></div>
        </div>
        <div class="vital hidden" data-key="armor">
            <div class="vital-ring"><div class="vital-fill"></div><span class="vital-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2.5 20 5.5v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6Z"/></svg>
            </span></div>
        </div>
        <div class="vital" data-key="hunger">
            <div class="vital-ring"><div class="vital-fill"></div><span class="vital-icon">
                <svg viewBox="0 0 24 24"><path d="M6.5 3c2 0 3.2 1.7 3.2 4.4 0 2.1-.8 3.6-2 4.2L9.4 20a1.6 1.6 0 0 1-3.2 0l1.7-8.4c-1.2-.6-2-2.1-2-4.2C5.9 4.7 6.7 3 6.5 3Zm11.7 0c1.8 1.2 3 3.7 3 6.6 0 3.3-1.6 6-3.8 6.9L18.6 20a1.6 1.6 0 0 1-3.2 0l1.2-10.4c-.6-.3-1-1-1-1.8 0-2.6 1.2-4.4 2.6-4.8Z"/></svg>
            </span></div>
        </div>
        <div class="vital" data-key="thirst">
            <div class="vital-ring"><div class="vital-fill"></div><span class="vital-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2.5c2.8 3.9 6.5 8.9 6.5 12.8a6.5 6.5 0 0 1-13 0c0-3.9 3.7-8.9 6.5-12.8Z"/></svg>
            </span></div>
        </div>
    </div>

    <!-- ═══════════════════════ BOTTOM RIGHT: VEHICLE ════════════════════ -->
    <div id="vehicleHud" class="hidden">
        <div id="seatbeltIcon">&#128663;</div>
        <div id="speedo">
            <div id="speedoReadout">
                <span id="speedValue">0</span>
                <span id="speedUnit">MPH</span>
            </div>
            <div id="speedoTrack"><div id="speedoTrackFill"></div></div>
        </div>
        <div id="vehicleStats">
            <div class="veh-stat">
                <span class="veh-label">Fuel</span>
                <div class="veh-bar"><div id="fuelFill" class="veh-bar-fill"></div></div>
                <span class="veh-value" id="fuelValue">0L</span>
            </div>
            <div class="veh-stat">
                <span class="veh-label">Gear</span>
                <span class="veh-value" id="gearValue">P</span>
            </div>
        </div>
    </div>
</div>

<!-- ═══════════════════════ /hudsettings PANEL ═════════════════════════ -->
<!-- Only draggable/interactive while open — #root stays pointer-events:
     none the rest of the time so the HUD never eats clicks meant for
     the game. Minimap isn't listed: it's the native radar repositioned
     via natives, not a DOM element, so dragging it here wouldn't
     actually move it. -->
<div id="hudSettings" class="hidden">
    <div class="hs-panel">
        <div class="hs-header">HUD Settings</div>
        <div class="hs-row"><span>Watermark</span><label class="hs-toggle"><input type="checkbox" data-comp="watermark" checked></label></div>
        <div class="hs-row"><span>Cash / Job</span><label class="hs-toggle"><input type="checkbox" data-comp="topRight" checked></label></div>
        <div class="hs-row"><span>Vitals</span><label class="hs-toggle"><input type="checkbox" data-comp="vitals" checked></label></div>
        <div class="hs-row"><span>Vehicle HUD</span><label class="hs-toggle"><input type="checkbox" data-comp="vehicleHud" checked></label></div>
        <div class="hs-hint">Drag any visible HUD element to reposition it while this panel is open.</div>
        <div class="hs-actions">
            <button id="hsReset">Reset positions</button>
            <button id="hsClose">Done</button>
        </div>
    </div>
</div>

<script src="js/app.js?v=2"></script>
</body>
</html>
