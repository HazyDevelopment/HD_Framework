<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HD Housing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="brochure" class="hidden">
    <div class="brochure-header">
        <span class="brochure-tag" id="brochureTag">FOR SALE</span>
        <span class="brochure-id" id="brochureId">flat_id</span>
    </div>
    <div class="brochure-label" id="brochureLabel">Property Name</div>
    <div class="brochure-size" id="brochureSize">Studio</div>
    <div class="brochure-price" id="brochurePrice">Not yet listed</div>
    <div class="brochure-hint">Contact a real estate agent to buy</div>
</div>

<div id="buzzPrompt" class="hidden">
    <div class="buzz-box">
        <div class="buzz-icon">🔔</div>
        <div class="buzz-text"><b id="buzzName">Someone</b> is at the door</div>
        <div class="buzz-actions">
            <button class="buzz-btn decline" id="buzzDecline">Ignore</button>
            <button class="buzz-btn accept" id="buzzAccept">Let In</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
