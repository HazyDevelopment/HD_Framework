<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HD AntiCheat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div id="panel">
            <div id="sidebar">
                <div id="brand">
                    <span class="brand-hd">HD</span><span class="brand-ac">ANTICHEAT</span>
                </div>
                <button class="tab-btn active" data-tab="overview">Overview</button>
                <button class="tab-btn" data-tab="detections">Detections</button>
                <div class="sidebar-spacer"></div>
                <button id="closeBtn" class="tab-btn close-btn">Close (ESC)</button>
            </div>

            <div id="content">

                <!-- ═══════════════════════ OVERVIEW ═══════════════════════ -->
                <section id="tab-overview" class="tab-panel active">
                    <div class="panel-header">
                        <h2>Live Suspicion Overview</h2>
                        <button id="refreshBtn" class="btn btn-sm">Refresh</button>
                    </div>
                    <div class="players-layout">
                        <div class="table-wrap">
                            <table id="playersTable">
                                <thead>
                                    <tr>
                                        <th>ID</th><th>Name</th><th>CitizenID</th><th>Ping</th><th>Score</th><th></th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>

                        <div id="playerActions" class="action-drawer hidden">
                            <div class="drawer-header">
                                <h3 id="paName">—</h3>
                                <button id="paClose" class="btn btn-sm btn-ghost">×</button>
                            </div>

                            <div class="drawer-row">
                                <label>Clear Suspicion Score</label>
                                <button class="btn btn-sm" id="btnClearScore">Clear</button>
                            </div>

                            <div class="drawer-row">
                                <label>Manual Ban</label>
                                <div class="inline-form">
                                    <input type="text" id="banReason" placeholder="Reason">
                                    <button class="btn btn-danger btn-sm" id="btnManualBan">Ban</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- ═══════════════════════ DETECTIONS ══════════════════════ -->
                <section id="tab-detections" class="tab-panel">
                    <div class="panel-header"><h2>Recent Detections</h2></div>
                    <div class="table-wrap">
                        <table id="flagsTable">
                            <thead>
                                <tr>
                                    <th>Name</th><th>CitizenID</th><th>Type</th><th>Detail</th><th>Score</th><th>Result</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <div id="toast" class="hidden"></div>

    <script src="js/app.js"></script>
</body>
</html>
