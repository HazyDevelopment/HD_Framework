<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Armoury</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap" class="hidden">
    <div id="panel">
      <div id="head">
        <div>
          <div id="dept">UNITED KINGDOM POLICE — ARMOURY</div>
          <div id="rank">—</div>
        </div>
        <span id="arv-badge" class="hidden">ARV AUTHORISED</span>
      </div>

      <div id="grid"></div>

      <div id="foot">
        <button id="btn-loadout" class="primary">Draw Full Loadout</button>
        <button id="btn-return-all" class="danger">Return All Equipment</button>
        <span class="hint">[E] interact · [ESC] close</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
